<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼字小勇士</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗡️ 拼字小勇士 🛡️</h1>
            <div class="player-info">
                <input type="text" id="playerName" placeholder="輸入你的名字" value="小勇士">
                <button onclick="startGame()">登入 / 開始</button>
            </div>
            
            <div class="settings">
                <div>
                    <label>📍 連續範圍：第</label>
                    <input type="number" id="startIdx" value="1" min="1">
                    <label>到</label>
                    <input type="number" id="endIdx" value="492" min="1">
                    <label>題</label>
                </div>
                
                <div style="margin-top: 15px;">
                    <label>🎯 精準選題：</label>
                    <div style="display: flex; justify-content: center; gap: 8px; margin-top: 5px;">
                        <input type="text" id="customIdx" placeholder="例如: 1, 5, 10-15" style="width: 50%;">
                        <button onclick="openWordSelector()" style="background-color: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;">🔍 看單字勾選</button>
                    </div>
                    <div style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                        (可直接輸入題號，或點擊「看單字勾選」從清單挑選)
                    </div>
                </div>

                <div style="margin-top: 15px; font-weight: bold; color: #0984e3; background: #e8f4fd; padding: 10px; border-radius: 8px;">
                    <label>🎮 測驗模式：</label><br>
                    <label style="cursor: pointer; margin-right: 15px; display: inline-block; margin-top: 8px;">
                        <input type="radio" name="gameMode" value="spelling" checked onchange="changeMode()"> ⌨️ 鍵盤拼寫
                    </label>
                    <label style="cursor: pointer; display: inline-block; margin-top: 8px;">
                        <input type="radio" name="gameMode" value="choice" onchange="changeMode()"> 👆 選擇題(四選一)
                    </label>
                </div>
                
                <div class="toggle-setting" style="margin-top: 15px;">
                    <label>
                        <input type="checkbox" id="autoNext" checked> ⏱️ 答完自動切換下一題
                    </label>
                </div>
            </div>

            <div class="upload-area" id="uploadArea" style="display: none;">
                <label for="uploadCsv" class="upload-btn">📂 上傳新進度 (CSV)</label>
                <input type="file" id="uploadCsv" accept=".csv" style="display: none;" onchange="handleFileUpload(event)">
                <div id="uploadStatus" class="upload-status"></div>
            </div>
        </header>

        <main id="gameArea" style="display: none;">
            <div class="stats">
                <span>🏆 分數: <span id="score">0</span></span>
                <button id="bossBtn" onclick="startBossBattle()" style="display: none;">👿 挑戰魔王</button>
                <button id="exportBtn" onclick="exportMistakes()">📥 下載錯題</button>
            </div>

            <div class="question-box">
                <h2 id="chineseHint">準備中...</h2>
                <p id="sentenceHint" class="sentence-hint" style="display: none;"></p>
                <button onclick="speakWord()" class="sound-btn">🔊 聽發音</button>
            </div>

            <div class="input-area">
                <div id="spellingArea">
                    <input type="text" id="englishInput" placeholder="請輸入英文" autocomplete="off" onkeypress="handleEnter(event)">
                    <button id="submitBtn" onclick="checkAnswer()">送出攻擊 ⚔️</button>
                </div>
                
                <div id="choiceArea" style="display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 10px;">
                    <!-- 選擇題按鈕由 JS 產生 -->
                </div>

                <div style="margin-top: 15px;">
                    <button id="nextBtn" onclick="nextQuestion()" style="display: none;">➡️ 下一題</button>
                </div>
            </div>

            <p id="feedbackMsg" class="feedback"></p>
        </main>
    </div>

    <!-- 單字挑選器 (Modal) -->
    <div id="wordSelectorModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeWordSelector()">&times;</span>
            <h2 style="color: #2d3436; margin-top: 0;">📝 勾選你想測驗的單字</h2>
            <div style="margin-bottom: 10px; text-align: left; background: #f1f2f6; padding: 10px; border-radius: 5px;">
                <input type="checkbox" id="selectAllWords" onchange="toggleSelectAll(this)"> 
                <label for="selectAllWords" style="font-weight: bold; color: #d63031; cursor: pointer;">全選 / 全不選</label>
            </div>
            <div id="wordListContainer" class="word-list-container">
                <!-- 單字清單由 JS 產生 -->
            </div>
            <button class="confirm-btn" onclick="confirmWordSelection()">確認選取</button>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="game.js"></script>
</body>
</html>
